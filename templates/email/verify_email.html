<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Verify Your Email</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f8f9fa; padding: 40px;">
    <div style="max-width: 600px; margin: auto; background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <h2 style="color: #333;">Welcome to Quietly!</h2>
        <p>Hi {{ user.username }},</p>
        <p>Thank you for registering. Please verify your email address by clicking the button below:</p>
        <p style="text-align: center;">
            <a href="{{ verify_link }}" style="background: #007bff; color: white; padding: 12px 24px; text-decoration: none; border-radius: 5px;">Verify Email</a>
        </p>
        <p>If the button doesn't work, copy this link and paste it into your browser:</p>
        <p>{{ verify_link }}</p>
        <p>— The Quietly Team</p>
    </div>
</body>
</html>
