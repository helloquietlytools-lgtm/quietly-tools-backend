<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Password Reset</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f9f9f9; padding: 20px; }
    .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 8px rgba(0,0,0,0.1); }
    .btn { display: inline-block; background: #007bff; color: white; padding: 10px 15px; border-radius: 5px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Hello {{ user.username }},</h2>
    <p>We received a request to reset your password. Click the button below to reset it:</p>
    <p><a href="{{ reset_link }}" class="btn">Reset Password</a></p>
    <p>If you didn’t request this, you can ignore this email.</p>
    <p>— The Support Team</p>
  </div>
</body>
</html>
